services:
  postgres:
    image: postgres:16-alpine
    container_name: cmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmp
      POSTGRES_PASSWORD: cmp_dev_password
      POSTGRES_DB: complaint_management
    ports:
      - "5433:5432"
    volumes:
      - cmp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmp -d complaint_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://cmp:cmp_dev_password@postgres:5432/complaint_management?schema=public
      JWT_SECRET: ${JWT_SECRET:-docker-dev-jwt-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-docker-dev-refresh-secret-change-me}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      STORAGE_PROVIDER: LOCAL
      STORAGE_LOCAL_DIR: uploads
      AI_PROVIDER: MOCK
    ports:
      - "4000:4000"
    volumes:
      - cmp_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: cmp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  cmp_pgdata:
  cmp_uploads:
